<h3><a href="https://playgameoflife.com/">playgameoflife.com (Cellular Automata; 元胞自动机)</a></h3>
<br />
<br />
<ul>
<li data-marpit-fragment="1">
<p>Any <font color = blue><strong>live</strong></font> cell with two or three live neighbours survives.</p>
</li>
<li data-marpit-fragment="2">
<p>All other <font color = blue><strong>live</strong></font> cells die in the next generation.<br />
<br /></p>
</li>
<li data-marpit-fragment="3">
<p>Any <font color = red><strong>dead</strong></font> cell with three live neighbours becomes a live cell.</p>
</li>
<li data-marpit-fragment="4">
<p>All other <font color = red><strong>dead</strong></font> cells stay dead.</p>
</li>
</ul>
</section>
